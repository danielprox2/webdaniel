<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocedor de Dígitos por IA</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Enlace al archivo main.css que ya está en la carpeta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <div class="container">
        <h1>🧠 Reconocedor de Dígitos</h1>
        <p>Sube una imagen de un número escrito a mano (0-9) para que la IA lo analice.</p>
        
        <!-- Formulario configurado exactamente como lo pide el app.py del profesor -->
        <form action="/predecir" method="POST" enctype="multipart/form-data">
            <div class="upload-box">
                <input type="file" name="imagen" accept="image/*" required>
            </div>
            <button type="submit">⚡ Analizar Imagen con IA</button>
        </form>
    </div>
</body>
</html>
