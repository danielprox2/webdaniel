<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocedor de Dígitos por IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <div class="container">
        <h1>🧠 Reconocedor IA</h1>
        <p>Sube una imagen de un dígito escrito a mano (0-9) para que la red neuronal lo clasifique.</p>
        
        <form id="form-ia">
            <div class="upload-box">
                <input type="file" id="input-imagen" name="imagen" accept="image/*" required>
                <!-- Miniatura de vista previa profesional -->
                <div id="preview-container">
                    <img id="preview" src="" alt="Vista previa del dígito">
                </div>
            </div>
            <button type="submit" id="btn-enviar">⚡ Analizar Dígito con IA</button>
        </form>

        <div id="resultado-box" class="resultado-card">
            <span style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600;">Resultado del Modelo</span>
            <div id="numero-texto" class="numero-grande">-</div>
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #cbd5e1;">
                <span>Nivel de confianza:</span>
                <strong id="confianza-texto" style="color: var(--primary);">0%</strong>
            </div>
            <div class="barra-fondo">
                <div id="barra-confianza" class="barra-relleno"></div>
            </div>
        </div>
    </div>

    <script>
        const inputImagen = document.getElementById('input-imagen');
        const previewContainer = document.getElementById('preview-container');
        const preview = document.getElementById('preview');
        const form = document.getElementById('form-ia');
        const btn = document.getElementById('btn-enviar');
        const cajaRes = document.getElementById('resultado-box');

        // Activar vista previa instantánea con diseño pro
        inputImagen.addEventListener('change', function(e) {
            const archivo = e.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(event) {
                    preview.src = event.target.result;
                    previewContainer.style.display = 'block';
                }
                lector.readAsDataURL(archivo);
            }
        });

        // Envío por AJAX para mantener la interfaz fluida
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = '⏳ Analizando matriz...';

            const formData = new FormData(form);

            try {
                const response = await fetch('/predecir', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    document.getElementById('numero-texto').textContent = data.numero_predicho;
                    document.getElementById('confianza-texto').textContent = data.confianza + '%';
                    document.getElementById('barra-confianza').style.width = data.confianza + '%';
                    cajaRes.style.display = 'block';
                }
            } catch (err) {
                alert('Ocurrió un error al conectar con el servidor.');
            } finally {
                btn.disabled = false;
                btn.textContent = '⚡ Analizar Dígito con IA';
            }
        });
    </script>
</body>
</html>
